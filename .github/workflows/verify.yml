name: Verify pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r premium_pipeline/v3/requirements.txt
      - run: python -m unittest discover -s premium_pipeline/v3/tests -v
      - run: python -m unittest discover -s automation/tests -v
      - run: python -m automation.dashboard_state --output /tmp/vidloom-dashboard.json
      - name: Validate static application syntax
        run: node --check control_center/app.js
