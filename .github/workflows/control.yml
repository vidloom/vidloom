name: Control automation

on:
  workflow_dispatch:
    inputs:
      action:
        description: Control action
        required: true
        type: choice
        options:
          - pause
          - resume
          - refresh

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vidloom-control-plane
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply control action
        run: python3 -m automation.control "${{ inputs.action }}"
      - name: Generate dashboard data
        run: python3 -m automation.dashboard_state --output control_center/data/dashboard.json
      - name: Persist public state
        run: |
          git config user.name "vidloom-automation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/config.json automation/state/dashboard.json control_center/data/dashboard.json
          git diff --cached --quiet || git commit -m "ops: ${{ inputs.action }} automation [skip ci]"
          git push
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: control_center
      - name: Deploy updated dashboard
        id: deployment
        uses: actions/deploy-pages@v5
