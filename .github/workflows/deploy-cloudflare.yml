name: Deploy Cloudflare control plane

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare-control/**"
      - "control_center/**"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: vidloom-cloudflare-deploy
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_GITHUB_TOKEN: ${{ secrets.CONTROL_GITHUB_TOKEN }}
      WORKER_CONTROL_PASSWORD: ${{ secrets.CONTROL_PASSWORD }}
      WORKER_SESSION_SECRET: ${{ secrets.CONTROL_SESSION_SECRET }}
      WORKER_MODAL_CONTROL_SECRET: ${{ secrets.CONTROL_SESSION_SECRET }}
      WORKER_MODAL_API_URL: ${{ vars.MODAL_API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-control/package-lock.json
      - name: Install locked dependencies
        working-directory: cloudflare-control
        run: npm ci
      - name: Verify control plane
        working-directory: cloudflare-control
        run: npm run check
      - name: Ensure account workers.dev domain
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          subdomain_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          current=$(curl --silent --show-error \
            --url "$subdomain_url" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if printf '%s' "$current" | grep -Eq '"subdomain"[[:space:]]*:[[:space:]]*"vidloom-omkar"'; then
            echo "workers.dev subdomain already configured"
          else
            curl --fail-with-body --silent --show-error \
              --request PUT \
              --url "$subdomain_url" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{"subdomain":"vidloom-omkar"}'
          fi
      - name: Configure encrypted Worker runtime secrets
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.WORKER_CONTROL_PASSWORD != '' }}
        working-directory: cloudflare-control
        run: |
          printf '%s' "$WORKER_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN
          printf '%s' "$WORKER_CONTROL_PASSWORD" | npx wrangler secret put CONTROL_PASSWORD
          printf '%s' "$WORKER_SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
          printf '%s' "$WORKER_MODAL_CONTROL_SECRET" | npx wrangler secret put MODAL_CONTROL_SECRET
          printf '%s' "$WORKER_MODAL_API_URL" | npx wrangler secret put MODAL_API_URL
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.WORKER_CONTROL_PASSWORD != '' }}
        working-directory: cloudflare-control
        run: npx wrangler deploy
      - name: Verify live control plane
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.WORKER_CONTROL_PASSWORD != '' }}
        env:
          CONTROL_URL: https://vidloom-control.vidloom-omkar.workers.dev
        run: |
          ready=false
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 15 "$CONTROL_URL/api/health" | grep -q '"ok":true'; then
              ready=true
              break
            fi
            echo "Waiting for the deployed Worker (attempt $attempt/18)"
            sleep 5
          done
          test "$ready" = true

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$CONTROL_URL/api/state")" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$CONTROL_URL/data/dashboard.json")" = "404"
          for page in / /about/ /privacy/ /terms/; do
            test "$(curl --location --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$CONTROL_URL$page")" = "200"
          done
      - name: Explain missing deployment credential
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.WORKER_CONTROL_PASSWORD == '' }}
        run: echo "Verification passed. Cloudflare API token, account ID, and CONTROL_PASSWORD must all be configured before deployment."
