name: Deploy Cloudflare control plane

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare-control/**"
      - "control_center/**"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: vidloom-cloudflare-deploy
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-control/package-lock.json
      - name: Install locked dependencies
        working-directory: cloudflare-control
        run: npm ci
      - name: Verify control plane
        working-directory: cloudflare-control
        run: npm run check
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        working-directory: cloudflare-control
        run: npx wrangler deploy
      - name: Explain missing deployment credential
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Verification passed. Add CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable to enable automatic deployment."
