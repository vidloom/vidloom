name: Configure Modal runtime secrets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      CLOUD_CONTROL_SECRET: ${{ secrets.CONTROL_SESSION_SECRET }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'modal==1.6.1'
      - name: Transfer credentials directly to Modal encrypted storage
        run: |
          python - <<'PY'
          import os, modal
          names = ['GROQ_API_KEY', 'YOUTUBE_CLIENT_ID', 'YOUTUBE_CLIENT_SECRET', 'YOUTUBE_REFRESH_TOKEN', 'CLOUD_CONTROL_SECRET']
          values = {name: os.environ[name] for name in names}
          assert all(values.values()), 'Required encrypted credential is missing'
          modal.Secret.objects.create('vidloom-runtime', values, allow_existing=True)
          modal.Secret.from_name('vidloom-runtime').update(values)
          print('Vidloom credentials configured in Modal. Values were not printed or persisted in the repository.')
          PY
