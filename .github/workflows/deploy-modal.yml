name: Deploy Modal autopilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "automation/cloud_*.py"
      - "automation/creator.py"
      - "automation/common.py"
      - "automation/groq_editorial.py"
      - "automation/youtube_upload.py"
      - "premium_pipeline/v3/**"
      - ".github/workflows/deploy-modal.yml"

permissions:
  contents: read

concurrency:
  group: vidloom-modal-deploy
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify cloud modules
        run: python -m py_compile automation/cloud_app.py automation/cloud_runtime.py automation/cloud_creator.py
      - name: Install Modal client
        run: python -m pip install --disable-pip-version-check modal==1.6.1
      - name: Deploy laptop-independent autopilot
        run: modal deploy automation/cloud_app.py
